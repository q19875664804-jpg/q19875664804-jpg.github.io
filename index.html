<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#100b08">
  <meta name="description" content="沉浸式图片书阅读器——高级艺术馆场景、实体书式双页翻阅与本地背景音乐。">
  <meta property="og:title" content="沉浸式图片书">
  <meta property="og:description" content="高级艺术馆风格的沉浸式数字画册。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="./assets/icons/icon-512.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <title>沉浸式图片书</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/book.css">
  <link rel="stylesheet" href="./css/ui.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <div id="app" class="app-shell">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="grain"></div>

    <main id="stage" class="stage" aria-label="沉浸式图片书阅读区">
      <div id="book-shadow" class="book-shadow"></div>
      <div id="book-frame" class="book-frame">
        <div class="book-edge book-edge-left"></div>
        <div class="book-edge book-edge-right"></div>
        <div class="book-spine" aria-hidden="true"></div>
        <div class="book-ribbon" aria-hidden="true"></div>
        <canvas id="book-canvas" aria-label="图片书"></canvas>
      </div>

      <div id="hud" class="hud" aria-live="polite">
        <header class="top-hud">
          <button id="brand-button" class="brand glass" type="button" aria-label="返回画册信息">
            <span class="brand-mark">◈</span><span id="brand-title">图片书</span>
          </button>
          <nav class="hud-actions glass" aria-label="阅读工具">
            <button id="directory-btn" class="hud-btn" type="button" title="目录">☰ <span>目录</span></button>
            <button id="music-btn" class="hud-btn" type="button" title="音乐">♫ <span>音乐</span></button>
            <button id="paper-btn" class="hud-btn" type="button" title="纸张音效">◌ <span>纸张</span></button>
            <button id="fullscreen-btn" class="hud-btn" type="button" title="全屏">⛶ <span>全屏</span></button>
            <button id="info-btn" class="hud-btn" type="button" title="作品信息">ⓘ <span>信息</span></button>
          </nav>
        </header>

        <div id="music-panel" class="floating-panel music-panel" hidden>
          <div class="panel-title">♫ 背景音乐</div>
          <div id="music-title" class="panel-caption">Silent Gallery</div>
          <div class="panel-row"><button id="music-play" class="mini-btn" type="button">播放</button><button id="music-mute" class="mini-btn" type="button">静音</button></div>
          <label class="range-row">音量<input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.35"></label>
        </div>

        <div id="audio-panel" class="floating-panel audio-panel" hidden>
          <div class="panel-title">纸张音效</div>
          <label class="range-row">音量<input id="paper-volume" type="range" min="0" max="1" step="0.01" value="0.60"></label>
          <div class="panel-row"><button id="paper-toggle" class="mini-btn" type="button">开启</button></div>
        </div>

        <div class="bottom-hud">
          <button id="prev-btn" class="round-btn glass" type="button" aria-label="上一页">‹</button>
          <div class="progress-area glass">
            <div id="page-counter" class="page-counter">第 1–2 页 / 0 页</div>
            <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
          </div>
          <button id="next-btn" class="round-btn glass" type="button" aria-label="下一页">›</button>
        </div>
      </div>
    </main>

    <div id="portrait-alert" class="portrait-alert">
      <div class="portrait-card glass">
        <div class="rotate-icon">↻</div>
        <h2>建议横屏阅读</h2>
        <p>画册为双页展开式设计，横屏能获得更完整的沉浸式阅读体验。</p>
      </div>
    </div>

    <section id="loading-screen" class="overlay-screen visible">
      <div class="loading-card glass">
        <div class="loading-book">▱</div>
        <div class="loading-title">IMAGE BOOK</div>
        <div id="loading-text" class="loading-text">正在准备画册</div>
        <div class="loading-dots"><i></i><i></i><i></i></div>
      </div>
    </section>

    <section id="welcome-screen" class="overlay-screen" hidden>
      <div class="welcome-card">
        <div class="welcome-kicker">PRIVATE VISUAL ARCHIVE</div>
        <div class="welcome-symbol">◈</div>
        <h1 id="welcome-title">我的私人画册</h1>
        <p id="welcome-subtitle">Immersive Image Book</p>
        <div class="welcome-rule"></div>
        <div class="welcome-meta" id="welcome-meta"></div>
        <div class="welcome-actions">
          <button id="start-reading" class="primary-btn" type="button">开始阅读</button>
          <button id="welcome-info" class="secondary-btn" type="button">作品介绍</button>
        </div>
        <div id="resume-hint" class="resume-hint" hidden></div>
      </div>
    </section>

    <aside id="directory-drawer" class="drawer" aria-label="目录" aria-hidden="true">
      <div class="drawer-head"><div><small>TABLE OF CONTENTS</small><h2>目录</h2></div><button id="drawer-close" class="icon-btn" type="button">×</button></div>
      <div id="thumbnail-grid" class="thumbnail-grid"></div>
    </aside>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>

    <section id="info-modal" class="modal" hidden>
      <div class="modal-card glass">
        <button id="info-close" class="icon-btn modal-close" type="button">×</button>
        <div class="modal-kicker">ABOUT THIS BOOK</div>
        <h2 id="info-title">我的图片书</h2>
        <div id="info-body" class="info-body"></div>
      </div>
    </section>

    <section id="viewer-modal" class="viewer" hidden>
      <div class="viewer-toolbar glass"><span id="viewer-page">第 1 页</span><div class="viewer-actions"><button id="viewer-reset" class="icon-btn" type="button">↺</button><button id="viewer-close" class="icon-btn" type="button">×</button></div></div>
      <div id="viewer-viewport" class="viewer-viewport"><img id="viewer-image" alt="" draggable="false"></div>
    </section>

    <section id="error-screen" class="overlay-screen" hidden>
      <div class="error-card glass">
        <div class="loading-book">!</div>
        <h2>画册暂时无法打开</h2>
        <p id="error-text">请检查网站部署文件。</p>
        <button id="retry-btn" class="primary-btn" type="button">重新加载</button>
      </div>
    </section>

    <audio id="background-audio" preload="metadata" loop></audio>
  </div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
